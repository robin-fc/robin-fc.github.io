<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="480" height="270" fill="#fbfcfe"/>
<text x="14" y="24" font-size="14" font-weight="700" fill="#1f2933">艾略特波浪（5 推动 + 3 调整）</text>

<polyline points="40,220 90,175 120,190 180,80 210,120 270,60 330,150 370,110 420,200" fill="none" stroke="#4a90d9" stroke-width="2"/>
<circle cx="90" cy="175" r="2.6" fill="#2fae6a"/>
<text x="90" y="165" font-size="12" font-weight="700" fill="#2fae6a" text-anchor="middle">1</text>
<circle cx="120" cy="190" r="2.6" fill="#e23b3b"/>
<text x="120" y="206" font-size="12" font-weight="700" fill="#e23b3b" text-anchor="middle">2</text>
<circle cx="180" cy="80" r="2.6" fill="#2fae6a"/>
<text x="180" y="70" font-size="12" font-weight="700" fill="#2fae6a" text-anchor="middle">3</text>
<circle cx="210" cy="120" r="2.6" fill="#e23b3b"/>
<text x="210" y="136" font-size="12" font-weight="700" fill="#e23b3b" text-anchor="middle">4</text>
<circle cx="270" cy="60" r="2.6" fill="#2fae6a"/>
<text x="270" y="50" font-size="12" font-weight="700" fill="#2fae6a" text-anchor="middle">5</text>
<circle cx="330" cy="150" r="2.6" fill="#e23b3b"/>
<text x="330" y="166" font-size="12" font-weight="700" fill="#e23b3b" text-anchor="middle">A</text>
<circle cx="370" cy="110" r="2.6" fill="#1f2933"/>
<text x="370" y="100" font-size="12" font-weight="700" fill="#1f2933" text-anchor="middle">B</text>
<circle cx="420" cy="200" r="2.6" fill="#e23b3b"/>
<text x="420" y="216" font-size="12" font-weight="700" fill="#e23b3b" text-anchor="middle">C</text>
<text x="150" y="230" font-size="10" fill="#2fae6a">1-3-5 推动浪</text>
<text x="330" y="230" font-size="10" fill="#e23b3b">A-B-C 调整浪</text>
<text x="240" y="244" font-size="10" fill="#5b6b7b" text-anchor="middle">第 3 浪常最强；2/4 浪不破前推起点，C 浪常最深</text>
</svg>