<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="480" height="270" fill="#fbfcfe"/>
<text x="14" y="24" font-size="14" font-weight="700" fill="#1f2933">均线信号：金叉 / 死叉 / 排列</text>
<line x1="40" y1="200" x2="440" y2="200" stroke="#c3ccd6" stroke-width="1"/><line x1="40" y1="45" x2="40" y2="200" stroke="#c3ccd6" stroke-width="1"/><polyline points="40,180 70,160 100,168 130,140 160,150 190,120 220,135 250,100 280,110 310,80 340,140 370,150 400,120 430,90" fill="none" stroke="#1f2933" stroke-width="1.6"/><polyline points="40,178 100,162 160,142 220,126 280,102 340,128 430,104" fill="none" stroke="#2fae6a" stroke-width="1.8"/><polyline points="40,176 100,168 160,156 220,142 280,120 340,132 430,120" fill="none" stroke="#4a90d9" stroke-width="1.8"/><circle cx="190" cy="128" r="5" fill="#f08c00"/><text x="150" y="118" font-size="10" fill="#2fae6a" text-anchor="start" font-weight="700">金叉</text><circle cx="340" cy="132" r="5" fill="#e23b3b"/><text x="350" y="124" font-size="10" fill="#e23b3b" text-anchor="start" font-weight="700">死叉</text><text x="200" y="170" font-size="10" fill="#2fae6a" text-anchor="start">多头排列（短在长上）</text><text x="330" y="170" font-size="10" fill="#e23b3b" text-anchor="start">空头排列（短在长下）</text><text x="240" y="246" font-size="10" fill="#5b6b7b" text-anchor="middle">金叉偏多、死叉偏空；需结合趋势与量，震荡市易假信号</text>
