<text x="275" y="38" font-size="11" fill="#4a90d9" font-weight="700">1×1（45°）</text>
<line x1="70" y1="230" x2="270" y2="130" stroke="#2fae6a" stroke-width="1.6" opacity="0.85"/>
<text x="275" y="140" font-size="11" fill="#2fae6a" font-weight="700">1×2（慢）</text>
