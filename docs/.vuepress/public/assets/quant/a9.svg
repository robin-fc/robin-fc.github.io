<line x1="190" y1="120" x2="190" y2="165" stroke="#2fae6a" stroke-width="1.4"/><rect x="184" y="125" width="12" height="33.0" fill="#2fae6a"/>
<line x1="230" y1="85" x2="230" y2="130" stroke="#2fae6a" stroke-width="1.4"/><rect x="224" y="90" width="12" height="33.0" fill="#2fae6a"/>
<line x1="270" y1="65" x2="270" y2="95" stroke="#2fae6a" stroke-width="1.4"/><rect x="264" y="70" width="12" height="18.0" fill="#2fae6a"/>
<line x1="310" y1="68" x2="310" y2="100" stroke="#e23b3b" stroke-width="1.4"/><rect x="304" y="72" width="12" height="23.0" fill="#e23b3b"/>
<line x1="70" y1="230" x2="440" y2="230" stroke="#9aa5b1" stroke-width="1"/>
<text x="430" y="246" font-size="9" fill="#5b6b7b" text-anchor="end">时间 →</text>
<text x="240" y="244" font-size="10" fill="#5b6b7b" text-anchor="middle">1×1 = 1 单位价格 / 1 单位时间；价格在 1×1 上方偏多、下方偏空</text>
</svg>