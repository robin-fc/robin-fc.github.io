<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="480" height="270" fill="#fbfcfe"/>
<text x="14" y="24" font-size="14" font-weight="700" fill="#1f2933">样本内 / 样本外（防过拟合）</text>
<line x1="40" y1="45" x2="40" y2="200" stroke="#c3ccd6" stroke-width="1"/><line x1="40" y1="200" x2="440" y2="200" stroke="#c3ccd6" stroke-width="1"/><line x1="240" y1="45" x2="240" y2="200" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="5,4"/><text x="140" y="40" font-size="10" fill="#2fae6a" text-anchor="middle">训练（样本内）</text><text x="340" y="40" font-size="10" fill="#e23b3b" text-anchor="middle">测试（样本外）</text><polyline points="40,180 90,170 140,120 190,150 240,90 300,180 350,150 400,190 440,175" fill="none" stroke="#1f2933" stroke-width="1.8"/><polyline points="40,150 140,140 240,150 340,155 440,160" fill="none" stroke="#f08c00" stroke-width="1.8"/><text x="250" y="80" font-size="9" fill="#1f2933" text-anchor="start">样本内很好</text><text x="300" y="190" font-size="9" fill="#e23b3b" text-anchor="start">样本外崩了</text><text x="240" y="246" font-size="10" fill="#5b6b7b" text-anchor="middle">只在历史上有效的参数 = 过拟合；用样本外 / 多区间检验</text>
