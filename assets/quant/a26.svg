<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="480" height="270" fill="#fbfcfe"/>
<text x="14" y="24" font-size="14" font-weight="700" fill="#1f2933">均线作为动态支撑 / 阻力</text>
<line x1="40" y1="200" x2="440" y2="200" stroke="#c3ccd6" stroke-width="1"/><line x1="40" y1="45" x2="40" y2="200" stroke="#c3ccd6" stroke-width="1"/><polyline points="40,180 110,165 180,150 250,135 320,120 390,105 440,98" fill="none" stroke="#4a90d9" stroke-width="2.0"/><polyline points="40,175 80,158 110,140 140,150 180,150 210,124 240,130 270,104 300,116 340,94 380,108 420,80" fill="none" stroke="#2fae6a" stroke-width="1.8"/><text x="300" y="84" font-size="9" fill="#4a90d9" text-anchor="start">SMA60（生命线）</text><circle cx="180" cy="150" r="5" fill="#2fae6a"/><text x="90" y="172" font-size="10" fill="#2fae6a" text-anchor="start" font-weight="700">回踩 SMA60 → 支撑</text><circle cx="380" cy="105" r="5" fill="#e23b3b"/><text x="300" y="98" font-size="10" fill="#e23b3b" text-anchor="start" font-weight="700">反弹到 SMA60 → 受阻</text><text x="240" y="246" font-size="10" fill="#5b6b7b" text-anchor="middle">上升趋势里回踩长均线常企稳；跌破=趋势转弱（假跌破会扫损）</text>
</svg>