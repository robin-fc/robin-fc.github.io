<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="480" height="270" fill="#fbfcfe"/>
<text x="14" y="24" font-size="14" font-weight="700" fill="#1f2933">筹码分布（成本分布）</text>
<line x1="40" y1="40" x2="40" y2="210" stroke="#1f2933" stroke-width="1.4"/><text x="30" y="216" font-size="9" fill="#5b6b7b" text-anchor="start">价</text><rect x="40" y="40" width="25.0" height="13" fill="#e23b3b"/><rect x="40" y="57" width="47.5" height="13" fill="#e23b3b"/><rect x="40" y="74" width="77.5" height="13" fill="#e23b3b"/><rect x="40" y="91" width="130.0" height="13" fill="#e23b3b"/><rect x="40" y="108" width="100.0" height="13" fill="#4a90d9"/><rect x="40" y="125" width="152.5" height="13" fill="#4a90d9"/><rect x="40" y="142" width="160.0" height="13" fill="#4a90d9"/><rect x="40" y="159" width="115.0" height="13" fill="#2fae6a"/><rect x="40" y="176" width="70.0" height="13" fill="#2fae6a"/><rect x="40" y="193" width="40.0" height="13" fill="#2fae6a"/><rect x="40" y="210" width="25.0" height="13" fill="#2fae6a"/><text x="40" y="60" font-size="9" fill="#e23b3b" text-anchor="start">套牢盘（上方套牢成本）</text><text x="40" y="175" font-size="9" fill="#2fae6a" text-anchor="start">获利盘（下方已获利）</text><text x="40" y="118" font-size="9" fill="#4a90d9" text-anchor="start">筹码峰（密集区）</text><text x="240" y="246" font-size="10" fill="#5b6b7b" text-anchor="middle">筹码越集中、越靠下，抛压越小；上方密集=套牢抛压</text>
</svg>