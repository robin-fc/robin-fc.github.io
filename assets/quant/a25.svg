<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="480" height="270" fill="#fbfcfe"/>
<text x="14" y="24" font-size="14" font-weight="700" fill="#1f2933">均线排列：粘合 → 多头 / 空头发散</text>
<line x1="40" y1="200" x2="440" y2="200" stroke="#c3ccd6" stroke-width="1"/><line x1="40" y1="45" x2="40" y2="200" stroke="#c3ccd6" stroke-width="1"/><line x1="165" y1="45" x2="165" y2="200" stroke="#9aa5b1" stroke-width="1" stroke-dasharray="5,4"/><polyline points="40,144 90,144 140,144 190,138 240,124 290,108 340,98 390,90 440,84" fill="none" stroke="#4a90d9" stroke-width="1.8"/><polyline points="40,142 90,140 140,142 190,130 240,112 290,95 340,82 390,72 440,66" fill="none" stroke="#f08c00" stroke-width="1.6"/><polyline points="40,140 90,142 140,138 190,120 240,100 290,80 340,65 390,55 440,50" fill="none" stroke="#2fae6a" stroke-width="1.6"/><text x="44" y="110" font-size="10" fill="#5b6b7b" text-anchor="start">粘合（震荡，三线纠缠）</text><text x="185" y="96" font-size="10" fill="#2fae6a" text-anchor="start" font-weight="700">多头：快在慢上</text><text x="340" y="60" font-size="9" fill="#2fae6a" text-anchor="start">SMA5</text><text x="356" y="96" font-size="9" fill="#f08c00" text-anchor="start">SMA20</text><text x="350" y="120" font-size="9" fill="#4a90d9" text-anchor="start">SMA60</text><text x="240" y="246" font-size="10" fill="#5b6b7b" text-anchor="middle">粘合=无趋势；发散后快线在上=多头、在下=空头；空头排列反之</text>
</svg>