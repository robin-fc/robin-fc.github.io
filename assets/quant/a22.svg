<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" style="max-width:100%;height:auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="480" height="270" fill="#fbfcfe"/>
<text x="14" y="24" font-size="14" font-weight="700" fill="#1f2933">风险定额 · 仓位 = 风险 ÷ 止损距离</text>
<rect x="40" y="70" width="150" height="34" fill="#2fae6a"/><text x="50" y="92" font-size="12" fill="#1f2933" text-anchor="start" font-weight="700">账户 100%</text><rect x="200" y="70" width="150" height="34" fill="#f08c00"/><text x="206" y="92" font-size="11" fill="#1f2933" text-anchor="start" font-weight="700">单笔风险 1~2%</text><rect x="360" y="70" width="80" height="34" fill="#4a90d9"/><text x="364" y="92" font-size="11" fill="#1f2933" text-anchor="start" font-weight="700">止损</text><text x="40" y="120" font-size="11" fill="#1f2933" text-anchor="start">仓位 = 账户 × 单笔风险% ÷ 止损幅度</text><text x="40" y="140" font-size="10" fill="#5b6b7b" text-anchor="start">例：100k 账户、风险1%、止损5% → 可开 20k 名义仓位</text><rect x="40" y="180" width="24" height="30" fill="#2fae6a"/><rect x="70" y="180" width="24" height="30" fill="#2fae6a"/><rect x="100" y="180" width="24" height="30" fill="#e23b3b"/><rect x="130" y="180" width="24" height="30" fill="#e23b3b"/><rect x="160" y="180" width="24" height="30" fill="#e23b3b"/><rect x="190" y="180" width="24" height="30" fill="#e23b3b"/><text x="40" y="222" font-size="10" fill="#5b6b7b" text-anchor="start">止损越大 → 仓位越小，保证单笔亏损恒定</text><text x="240" y="246" font-size="10" fill="#5b6b7b" text-anchor="middle">先定止损距离，再反推仓位；不先定止损就不能定仓位</text>
</svg>